<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXA CHAT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body><div class="app">
    <header>
        <h1>NEXA <span>CHAT</span></h1>

    <div class="search">
        <input type="text" placeholder="ابحث عن محادثة...">
    </div>

    <section class="chats">
        <h3>المحادثات</h3>

            <div class="icon">💬</div>
            <h2>أهلاً بك في NEXA</h2>
            <p>ابدأ رحلتك في التواصل مع أصدقائك.</p>
        </div>
    </section>

    <button class="new-chat">+ محادثة جديدة</button>
</div>

<script src="script.js"></script>

</body>
</html>
